<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{styles}}
<style>
/* no rail on this page: the work area is the whole window, which the console's .app shares with its rail */
.app { display: flex; flex-direction: column; }
.app > main.work { flex: 1 1 auto; min-height: 0; }
</style>
</head>
<body data-entry="{{entry}}" data-name="{{name}}">
<div class="app">
<main class="work">
<div class="ev-root">
<div class="ev-report">
<section class="ev-sec-replay" data-hook="replay"><p class="rp-say">Opening the replay…</p></section>
</div>
</div>
</main>
</div>
<script type="module" src="/page.js"></script>
</body>
</html>
